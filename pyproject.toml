[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-dispute-agents"
version = "0.1.0"
description = "Supervisor DAG for Olist e-commerce dispute resolution"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.34,<1",
  "llama-cpp-python>=0.3.34,<1",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
resolve-disputes = "ecommerce_dispute.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
